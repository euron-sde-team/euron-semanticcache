# Tooling configuration for the whole repository. Each Python package has its own pyproject.toml.

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/console", "infra"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "C4", "PT"]
ignore = ["S101", "S311", "RUF012", "E501", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B011", "PT018", "RUF029"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["apps/console", "\\.venv"]
explicit_package_bases = true
mypy_path = ["packages/core", "apps/api", "apps/mock-llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/core/tests", "apps/api/tests", "apps/mock-llm/tests"]
markers = ["integration: needs a running Redis (SC_TEST_REDIS_URL)"]
addopts = "-q"
