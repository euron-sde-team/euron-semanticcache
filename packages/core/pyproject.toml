[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticcache-core"
version = "0.1.0"
description = "Semantic cache for LLM responses: scoped vector matching, safety guards, Redis storage and cost accounting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "redis>=5.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "numpy>=1.26",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["semanticcache_core*"]

[tool.setuptools.package-data]
semanticcache_core = ["py.typed"]
