          - type: 'null'
          title: X-Api-Key
      - name: x-sc-namespace
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Same as the `namespace` query parameter
          title: X-Sc-Namespace
        description: Same as the `namespace` query parameter
      responses:
        '200':
          description: Successful Response
