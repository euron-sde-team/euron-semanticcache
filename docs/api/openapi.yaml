      summary: Nearest cached prompts, with the verdict and reason for each
      description: 'Shows why something did or did not hit: similarity, whether the candidate shares the
        safety scope

        (model, system prompt, history), and which guard (numbers, identifiers, negation) rejected it.'
      operationId: explain_v1_cache_explain_post
      parameters:
      - name: namespace
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Defaults to the key's namespace, then 'default'
          title: Namespace
        description: Defaults to the key's namespace, then 'default'
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-sc-namespace
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
