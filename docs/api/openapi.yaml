openapi: 3.1.0
info:
  title: Euron SemanticCache API
  description: '

    **Euron SemanticCache** is an intelligent response cache for LLM applications. Point an OpenAI SDK
    at

    `/v1/chat/completions` and repeated or similar questions are answered from cache: no tokens, no provider
    latency.

    Authenticate with `X-API-Key: <key>` or `Authorization: Bearer <key>`.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.1.0
paths:
  /v1/chat/completions:
    post:
      tags:
      - proxy
      summary: OpenAI-compatible chat completion, served from cache when possible
      description: 'Drop-in for `POST /v1/chat/completions`. Set the SDK `base_url` to this API and use
        a SemanticCache key.


        A hit never calls the provider. A miss is forwarded, and complete text answers are cached. Per-request
        control

        through headers: `X-SC-Namespace`, `X-SC-Cache` (`bypass`, `refresh`, `no-store`, `only-if-cached`),
        `X-SC-TTL`

        and `X-SC-Tags`. Streaming is supported: cached answers are replayed as an event stream.'
      operationId: chat_completions_v1_chat_completions_post
      parameters:
      - name: x-sc-namespace
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Sc-Namespace
      - name: x-sc-cache
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: bypass | refresh | no-store | only-if-cached
          title: X-Sc-Cache
        description: bypass | refresh | no-store | only-if-cached
      - name: x-sc-ttl
        in: header
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: TTL in seconds for this entry
          title: X-Sc-Ttl
        description: TTL in seconds for this entry
      - name: x-sc-tags
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated tags for invalidation
          title: X-Sc-Tags
        description: Comma-separated tags for invalidation
      - name: x-upstream-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Upstream-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/cache/lookup:
    post:
      tags:
      - cache
      summary: Would this request hit? (never calls the provider, never counted)
      operationId: lookup_v1_cache_lookup_post
      parameters:
      - name: namespace
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Defaults to the key's namespace, then 'default'
          title: Namespace
        description: Defaults to the key's namespace, then 'default'
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: x-sc-namespace
