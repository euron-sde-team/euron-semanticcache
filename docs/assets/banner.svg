<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron SemanticCache</title>
  <desc id="d">An intelligent AI response cache that saves money, reduces token consumption and makes AI applications faster</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#0c1c1a"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" fill="#f4f6fb" font-size="54" font-weight="650" letter-spacing="-1.2">Euron SemanticCache</text>
    <text x="74" y="186" fill="#9aa3b5" font-size="22">An intelligent AI response cache: saves money, cuts tokens, answers faster.</text>
    <g font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7d879b">
      <text x="74" y="246">OpenAI-compatible</text><text x="248" y="246">scoped matching</text>
      <text x="418" y="246">safety guards</text><text x="570" y="246">per-tenant namespaces</text><text x="790" y="246">Terraform + Floci</text>
    </g>
  </g>
  <g transform="translate(930 80)">
    <circle cx="110" cy="80" r="74" fill="#2dd4bf" fill-opacity=".9"/>
    <circle cx="186" cy="80" r="74" fill="#06312c" fill-opacity=".72" stroke="#2dd4bf" stroke-opacity=".6" stroke-width="2"/>
    <text x="148" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8fffb">HIT</text>
  </g>
</svg>
